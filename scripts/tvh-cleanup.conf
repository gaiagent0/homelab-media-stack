# TVHeadend Recording Cleanup - Konfiguráció
# Ezt a fájlt szerkeszd a felvételek kezeléséhez

# Recordings könyvtár
RECORDINGS_DIR="/recordings"

# Megtartandó napok száma (ennyi napnál régebbi FELVÉTELEKET törli, ha nincsenek a megtartandó listában)
KEEP_DAYS=30

# Minimális fájlméret MB-ban (ennél kisebb fájlokat törli)
MIN_SIZE_MB=50

# Megtartandó sorozatok (ezeket SOHA nem törli)
KEEP_SERIES=(
    "Az elefántok titkai"
    # Új sorozatot itt adhatsz hozzá:
    # "Új Sorozat Neve"
)

# Explicit törlendő sorozatok (ezeket AZONNAL törli)
DELETE_SERIES=(
    "Linda"
    "Barátok közt"
    "Heartland"
    "Jóban Rosszban"
)

# Naplófájl helye
LOG_FILE="/opt/tvheadend/logs/tvh-cleanup.log"
