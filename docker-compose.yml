  # ─────────────────────────────────────────────────────────────
  # VPN: Gluetun killswitch
  # qBittorrent is network_mode: service:gluetun — shares its IP
  # ─────────────────────────────────────────────────────────────
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_REGIONS=${VPN_REGION:-Hungary}
      - UPDATER_PERIOD=24h
      # Without these two, iptables killswitch resets inbound connections
      # to the qBittorrent WebUI port (8080) after a Gluetun recreate/restart.
      - FIREWALL_VPN_INPUT_PORTS=8080
      - FIREWALL_INPUT_PORTS=8080
      - TZ=${TZ}
    volumes:
      - ${DOCKER_VOLUMES}/gluetun:/gluetun
    restart: unless-stopped
    networks:
      - media_network
